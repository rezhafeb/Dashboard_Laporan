<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Progress Laporan - Google Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google API & Identity Services SDK -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between p-4 shadow-lg">
            <div>
                <div class="flex items-center space-x-3 p-3 mb-6">
                    <i class="fa-solid fa-chart-line text-2xl text-blue-400"></i>
                    <span class="text-xl font-bold tracking-wide">Monitoring Laporan</span>
                </div>
                <nav class="space-y-1">
                    <button onclick="switchCategory('bulanan')" id="btn-bulanan" class="nav-btn w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition bg-blue-600 font-medium">
                        <span><i class="fa-regular fa-calendar-days mr-3"></i> Bulanan</span>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">12 File</span>
                    </button>
                    <button onclick="switchCategory('triwulan')" id="btn-triwulan" class="nav-btn w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition font-medium">
                        <span><i class="fa-solid fa-chart-pie mr-3"></i> Triwulan</span>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">4 File</span>
                    </button>
                    <button onclick="switchCategory('semester')" id="btn-semester" class="nav-btn w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition font-medium">
                        <span><i class="fa-solid fa-layer-group mr-3"></i> Semester</span>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">2 File</span>
                    </button>
                    <button onclick="switchCategory('tahunan')" id="btn-tahunan" class="nav-btn w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-800 transition font-medium">
                        <span><i class="fa-solid fa-calendar mr-3"></i> Tahunan</span>
                        <span class="text-xs bg-slate-700 px-2 py-1 rounded text-slate-300">1 File</span>
                    </button>
                </nav>
            </div>
            
            <!-- STATUS GOOGLE DRIVE -->
            <div class="p-3 bg-slate-800 rounded-lg text-xs space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-slate-400"><i class="fa-brands fa-google-drive text-green-400 mr-1"></i> Google Drive</span>
                    <span id="gdrive-status" class="text-red-400 font-semibold">Offline</span>
                </div>
                <button id="auth-btn" onclick="handleAuthClick()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 rounded font-medium transition">
                    Hubungkan Drive
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 overflow-y-auto p-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-200 mb-6">
                <div>
                    <h1 id="category-title" class="text-3xl font-bold text-slate-800 capitalize">Laporan Bulanan</h1>
                    <p class="text-slate-500 text-sm mt-1">Sistem sinkronisasi terpusat menggunakan Google Drive API.</p>
                </div>
                <button onclick="openAddModal()" class="mt-4 md:mt-0 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium shadow-md transition flex items-center">
                    <i class="fa-solid fa-plus mr-2"></i> Tambah Jenis Laporan
                </button>
            </div>

            <div id="report-container" class="space-y-6">
                <!-- Data Render -->
            </div>
        </main>
    </div>

    <!-- MODAL TAMBAH LAPORAN -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Tambah Jenis Laporan Baru</h3>
            <input type="text" id="newReportTitle" placeholder="Misal: Laporan APOA" class="w-full border border-slate-300 rounded-lg p-2.5 mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            <div class="flex justify-end space-x-3">
                <button onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100">Batal</button>
                <button onclick="addNewReport()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURASI GOOGLE API
        const API_KEY = 'AIzaSyAXVpCw56k_ULlfql-2foqwro63FRAtCtg';
        const CLIENT_ID = 'P729207298067-gkejht3s8bqe3m552djqa7hi9mjj1fnt.apps.googleusercontent.com';
        const FOLDER_ID = '1GOkyZ4crfdwbxthlKFZQNMRXSoEE5_xG';
        const SCOPES = 'https://www.googleapis.com/auth/drive.file';

        let tokenClient;
        let gapiInited = false;
        let gsiInited = false;
        let accessToken = null;

        const categoryTargets = { bulanan: 12, triwulan: 4, semester: 2, tahunan: 1 };
        let currentCategory = 'bulanan';

        let reportsData = JSON.parse(localStorage.getItem('reportsData')) || [
            { id: 1, category: 'bulanan', title: 'Laporan APOA', files: Array(12).fill(null) }
        ];

        function saveState() {
            localStorage.setItem('reportsData', JSON.stringify(reportsData));
            renderReports();
        }

        // INIT GOOGLE LIBRARIES
        window.onload = function() {
            gapi.load('client', initGapiClient);
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (tokenResponse) => {
                    if (tokenResponse.error) return;
                    accessToken = tokenResponse.access_token;
                    document.getElementById('gdrive-status').innerText = 'Terhubung';
                    document.getElementById('gdrive-status').className = 'text-green-400 font-semibold';
                    document.getElementById('auth-btn').innerText = 'Koneksi Aktif';
                    document.getElementById('auth-btn').classList.replace('bg-blue-600', 'bg-slate-700');
                },
            });
            renderReports();
        };

        async function initGapiClient() {
            await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
            gapiInited = true;
        }

        function handleAuthClick() {
            if (accessToken === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            }
        }

        // UPLOAD FILE KE GOOGLE DRIVE API
        async function uploadFileToDrive(reportId, fileIndex, inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            if (!accessToken) {
                alert('Silakan klik tombol "Hubungkan Drive" di sidebar terlebih dahulu!');
                return;
            }

            const report = reportsData.find(r => r.id === reportId);
            const periodName = getPeriodLabel(currentCategory, fileIndex);
            
            // Format Nama File di Google Drive
            const driveFileName = `[${report.title}] - ${periodName} - ${file.name}`;

            const metadata = {
                name: driveFileName,
                parents: [FOLDER_ID]
            };

            const formData = new FormData();
            formData.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            formData.append('file', file);

            try {
                // Tampilkan Status Uploading
                alert('Sedang mengunggah file ke Google Drive kantor...');
                
                const response = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                    method: 'POST',
                    headers: new Headers({ 'Authorization': 'Bearer ' + accessToken }),
                    body: formData
                });

                const result = await response.json();

                if (result.id) {
                    report.files[fileIndex] = {
                        name: file.name,
                        driveId: result.id,
                        webViewLink: `https://drive.google.com/file/d/${result.id}/view`
                    };
                    saveState();
                    alert('File berhasil diunggah ke Google Drive!');
                }
            } catch (err) {
                console.error(err);
                alert('Gagal mengunggah file ke Google Drive.');
            }
        }

        // TAMPILAN DASHBOARD
        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('category-title').innerText = `Laporan ${cat}`;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-blue-600'));
            document.getElementById(`btn-${cat}`).classList.add('bg-blue-600');
            renderReports();
        }

        function renderReports() {
            const container = document.getElementById('report-container');
            container.innerHTML = '';
            const filtered = reportsData.filter(r => r.category === currentCategory);
            const targetCount = categoryTargets[currentCategory];

            filtered.forEach(report => {
                const uploadedCount = report.files.filter(f => f !== null).length;
                const percentage = Math.round((uploadedCount / targetCount) * 100);

                let gridHtml = '';
                for (let i = 0; i < targetCount; i++) {
                    const file = report.files[i];
                    const label = getPeriodLabel(currentCategory, i);

                    if (file) {
                        gridHtml += `
                            <div class="border border-green-200 bg-green-50/50 rounded-lg p-3 flex flex-col justify-between">
                                <div>
                                    <span class="text-xs font-semibold text-green-700 block mb-1">${label}</span>
                                    <a href="${file.webViewLink}" target="_blank" class="text-xs text-blue-600 font-medium truncate block hover:underline" title="Buka di Drive">
                                        <i class="fa-solid fa-file-pdf text-red-500 mr-1"></i> ${file.name}
                                    </a>
                                </div>
                                <div class="flex justify-end space-x-2 mt-3 pt-2 border-t border-green-100">
                                    <button onclick="deleteFile(${report.id}, ${i})" class="text-xs text-red-600 hover:underline">Hapus</button>
                                </div>
                            </div>`;
                    } else {
                        gridHtml += `
                            <div class="border border-dashed border-slate-300 bg-slate-50/50 rounded-lg p-3 flex flex-col justify-between hover:border-blue-400 transition">
                                <div>
                                    <span class="text-xs font-semibold text-slate-500 block mb-1">${label}</span>
                                    <p class="text-xs text-slate-400 italic">Belum ada file</p>
                                </div>
                                <div class="mt-3 pt-2">
                                    <label class="w-full bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 text-xs py-1.5 px-2 rounded font-medium cursor-pointer flex items-center justify-center">
                                        <i class="fa-solid fa-upload mr-1.5 text-blue-500"></i> Upload
                                        <input type="file" class="hidden" onchange="uploadFileToDrive(${report.id}, ${i}, this)">
                                    </label>
                                </div>
                            </div>`;
                    }
                }

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-6';
                card.innerHTML = `
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                        <h2 class="text-xl font-bold text-slate-800">${report.title}</h2>
                        <div class="flex items-center space-x-4">
                            <span class="text-sm font-semibold text-slate-600">${uploadedCount} dari ${targetCount} File</span>
                            <span class="text-lg font-bold ${percentage === 100 ? 'text-green-600' : 'text-blue-600'}">${percentage}%</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-3 mb-6 overflow-hidden">
                        <div class="h-3 rounded-full transition-all duration-500 ${percentage === 100 ? 'bg-green-500' : 'bg-blue-600'}" style="width: ${percentage}%"></div>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3">${gridHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function getPeriodLabel(cat, idx) {
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            if (cat === 'bulanan') return months[idx];
            if (cat === 'triwulan') return `Triwulan ${idx + 1}`;
            if (cat === 'semester') return `Semester ${idx + 1}`;
            return `Tahun Ini`;
        }

        function deleteFile(reportId, fileIdx) {
            const report = reportsData.find(r => r.id === reportId);
            if (report) {
                report.files[fileIdx] = null;
                saveState();
            }
        }

        function openAddModal() { document.getElementById('addModal').classList.replace('hidden', 'flex'); }
        function closeAddModal() { document.getElementById('addModal').classList.replace('flex', 'hidden'); }
        function addNewReport() {
            const title = document.getElementById('newReportTitle').value.trim();
            if (!title) return;
            reportsData.push({
                id: Date.now(),
                category: currentCategory,
                title: title,
                files: Array(categoryTargets[currentCategory]).fill(null)
            });
            saveState();
            closeAddModal();
        }
    </script>
</body>
</html>

<style>
:root{--primary:#173f70;--dark:#0c2d50;--light:#2467aa;--bg:#f4f7fb;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--success:#16a34a;--warning:#f59e0b;--danger:#dc2626;--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
.sidebar{position:fixed;left:0;top:0;width:260px;height:100vh;background:linear-gradient(180deg,var(--dark),var(--primary));color:#fff;padding:24px 15px;z-index:20}
.brand{display:flex;gap:12px;align-items:center;padding:4px 10px 28px}.brand-icon{font-size:28px}.brand strong,.brand span{display:block}.brand span{font-size:12px;opacity:.7;margin-top:3px}
.menu{width:100%;border:0;background:transparent;color:#dce8f5;text-align:left;padding:13px 15px;border-radius:12px;margin:4px 0;font-size:14px;cursor:pointer}.menu:hover,.menu.active{background:rgba(255,255,255,.14);color:#fff}
.main{margin-left:260px;min-height:100vh}.topbar{background:#fff;border-bottom:1px solid var(--border);padding:22px 30px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:10}.topbar h1{margin:0;font-size:23px}.topbar p{margin:5px 0 0;color:var(--muted);font-size:13px}.hamburger{display:none;border:0;background:none;font-size:24px}.year-box{margin-left:auto;display:flex;align-items:center;gap:8px}.year-box label{font-size:12px;color:var(--muted)}select,input,textarea{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;font:inherit}
#content{padding:28px 30px}.hero{background:linear-gradient(120deg,var(--primary),#2e70ad);color:white;border-radius:20px;padding:28px;margin-bottom:22px}.hero h2{margin:0 0 7px;font-size:25px}.hero p{margin:0;opacity:.85}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.stat,.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 5px 18px rgba(20,40,70,.05)}.stat{padding:20px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:28px;font-weight:700;margin-top:8px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 14px}.section-head h2{font-size:18px;margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600}.btn-primary{background:var(--primary);color:#fff}.btn-light{background:#eef4fa;color:var(--primary)}.btn-danger{background:#fee2e2;color:var(--danger)}.reports{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{padding:19px}.report-card h3{margin:0 0 6px;font-size:16px}.muted{color:var(--muted);font-size:12px}.progress{height:9px;background:#edf1f5;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--light);border-radius:20px}.progress-row{display:flex;justify-content:space-between;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;padding:50px;color:var(--muted);background:#fff;border:1px dashed var(--border);border-radius:16px}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px 15px;border-bottom:1px solid var(--border);text-align:left;font-size:13px}.table th{background:#f8fafc;color:var(--muted);font-weight:600}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:600}.badge-ok{background:#dcfce7;color:#15803d}.badge-no{background:#fff7ed;color:#c2410c}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,25,45,.5);z-index:50;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:24px}.modal h2{margin-top:0}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px}.form-group input,.form-group select,.form-group textarea{width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.upload-box{border:2px dashed #cbd5e1;padding:22px;text-align:center;border-radius:14px;background:#f8fafc}.toast{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:12px 17px;border-radius:10px;display:none;z-index:100;font-size:13px}.toast.show{display:block}.spinner{display:none;position:fixed;inset:0;background:rgba(255,255,255,.65);z-index:90;align-items:center;justify-content:center;font-weight:700;color:var(--primary)}
@media(max-width:1100px){.reports{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamburger{display:block}.topbar{padding:16px}.topbar h1{font-size:18px}.topbar p{display:none}.year-box label{display:none}#content{padding:18px 14px}.stats,.reports{grid-template-columns:1fr}.hero{padding:22px}.section-head{align-items:flex-start;gap:10px;flex-direction:column}}
</style>

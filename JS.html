<script>
let state={laporan:[],files:[],year:new Date().getFullYear(),kategori:null};

document.addEventListener('DOMContentLoaded',()=>{initYears();loadData()});
function initYears(){const s=document.getElementById('globalYear');for(let y=new Date().getFullYear()+1;y>=2020;y--){s.innerHTML+=`<option value="${y}">${y}</option>`}s.value=state.year}
function changeYear(){state.year=Number(document.getElementById('globalYear').value);renderCurrent()}
function loadData(){google.script.run.withSuccessHandler(d=>{state.laporan=d.laporan;state.files=d.files;renderCurrent()}).withFailureHandler(err=>toast(err.message)).getDashboardData()}
function renderCurrent(){state.kategori?showKategori(state.kategori):showDashboard()}
function showDashboard(){state.kategori=null;active(0);title('Dashboard Monitoring Laporan','Pantau kelengkapan laporan tahun '+state.year+'.');const rows=state.laporan.filter(x=>x.tahun===state.year);let total=0,up=0;rows.forEach(r=>{total+=r.target;up+=state.files.filter(f=>f.laporanId===r.id).length});let pct=total?Math.round(up/total*100):0;
document.getElementById('content').innerHTML=`<div class="hero"><h2>Monitoring Laporan ${state.year}</h2><p>Kelola jenis laporan, periode, file, dan progres dalam satu dashboard.</p></div>
<div class="stats"><div class="stat"><div class="label">Total Jenis Laporan</div><div class="value">${rows.length}</div></div><div class="stat"><div class="label">Target File</div><div class="value">${total}</div></div><div class="stat"><div class="label">File Terunggah</div><div class="value">${up}</div></div><div class="stat"><div class="label">Progress</div><div class="value">${pct}%</div></div></div>
<div class="section-head"><h2>Ringkasan Kategori</h2></div><div class="reports">${['Bulanan','Triwulan','Semester','Tahunan','Lainnya'].map(k=>categoryCard(k,rows)).join('')}</div>`}
function categoryCard(k,rows){const a=rows.filter(x=>x.kategori===k),t=a.reduce((s,x)=>s+x.target,0),u=a.reduce((s,x)=>s+state.files.filter(f=>f.laporanId===x.id).length,0),p=t?Math.min(100,Math.round(u/t*100)):0;return `<div class="card"><h3>${icon(k)} ${k}</h3><div class="muted">${a.length} jenis laporan</div><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="progress-row"><span>${u}/${t} file</span><b>${p}%</b></div><div class="actions"><button class="btn btn-light" onclick="showKategori('${k}')">Lihat</button></div></div>`}
function showKategori(k){state.kategori=k;active(['Bulanan','Triwulan','Semester','Tahunan','Lainnya'].indexOf(k)+1);title('Laporan '+k,'Daftar jenis laporan tahun '+state.year+'.');const rows=state.laporan.filter(x=>x.kategori===k&&x.tahun===state.year);
document.getElementById('content').innerHTML=`<div class="section-head"><h2>Jenis Laporan</h2><button class="btn btn-primary" onclick="openReportForm('${k}')">＋ Tambah Laporan</button></div>${rows.length?`<div class="reports">${rows.map(reportCard).join('')}</div>`:'<div class="empty">Belum ada jenis laporan untuk kategori ini.<br><br><button class="btn btn-primary" onclick="openReportForm(\\''+k+'\\')">＋ Tambah Jenis Laporan</button></div>'}`}
function reportCard(r){const fs=state.files.filter(f=>f.laporanId===r.id),p=Math.min(100,Math.round(fs.length/r.target*100));return `<div class="card report-card"><h3>${esc(r.nama)}</h3><div class="muted">${esc(r.keterangan||'Tidak ada keterangan')} · ${r.tahun}</div><div class="progress"><div class="bar" style="width:${p}%"></div></div><div class="progress-row"><span>${fs.length}/${r.target} file</span><b>${p}%</b></div><div class="actions"><button class="btn btn-primary" onclick="manage('${r.id}')">Kelola</button><button class="btn btn-light" onclick="openReportForm('${r.kategori}','${r.id}')">Edit</button><button class="btn btn-danger" onclick="deleteReport('${r.id}')">Hapus</button></div></div>`}
function manage(id){const r=state.laporan.find(x=>x.id===id),fs=state.files.filter(f=>f.laporanId===id),periods=getPeriods(r);showModal(`<h2>Kelola: ${esc(r.nama)}</h2><p class="muted">Tahun ${r.tahun} · Progress ${Math.min(100,Math.round(fs.length/r.target*100))}%</p><div class="table-wrap"><table class="table"><tr><th>Periode</th><th>Status</th><th>File</th><th>Aksi</th></tr>${periods.map(p=>{const f=fs.find(x=>x.periode===p);return `<tr><td>${p}</td><td>${f?'<span class="badge badge-ok">Sudah</span>':'<span class="badge badge-no">Belum</span>'}</td><td>${f?`<a href="${f.url}" target="_blank">${esc(f.namaFile)}</a>`:'-'}</td><td>${f?`<button class="btn btn-danger" onclick="deleteFile('${f.id}','${id}')">Hapus</button>`:`<button class="btn btn-primary" onclick="upload('${id}','${p}')">Upload</button>`}</td></tr>`}).join('')}</table></div><div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Tutup</button></div>`)}
function getPeriods(r){if(r.kategori==='Bulanan')return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];if(r.kategori==='Triwulan')return ['Triwulan I','Triwulan II','Triwulan III','Triwulan IV'];if(r.kategori==='Semester')return ['Semester I','Semester II'];if(r.kategori==='Tahunan')return ['Tahunan'];return Array.from({length:r.target},(_,i)=>'Periode '+(i+1))}
function openReportForm(k,id){const r=id?state.laporan.find(x=>x.id===id):null;showModal(`<h2>${r?'Edit':'Tambah'} Jenis Laporan</h2><div class="form-group"><label>Nama Laporan</label><input id="fNama" value="${esc(r?.nama||'')}"></div><div class="form-group"><label>Keterangan</label><textarea id="fKet">${esc(r?.keterangan||'')}</textarea></div><div class="form-group"><label>Tahun</label><input id="fTahun" type="number" value="${r?.tahun||state.year}"></div>${k==='Lainnya'?`<div class="form-group"><label>Target File</label><input id="fTarget" type="number" min="1" value="${r?.target||1}"></div>`:''}<div class="modal-actions"><button class="btn btn-light" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveReport('${k}','${id||''}')">Simpan</button></div>`)}
function saveReport(k,id){const data={id,nama:document.getElementById('fNama').value.trim(),keterangan:document.getElementById('fKet').value,tahun:Number(document.getElementById('fTahun').value),target:document.getElementById('fTarget')?.value||1,kategori:k};if(!data.nama)return toast('Nama laporan wajib diisi.');busy(true);const fn=id?'editLaporan':'tambahLaporan';google.script.run.withSuccessHandler(()=>{busy(false);closeModal();loadData();toast('Berhasil disimpan.')}).withFailureHandler(e=>{busy(false);toast(e.message)})[fn](data)}
function deleteReport(id){if(!confirm('Hapus laporan beserta seluruh file terkait?'))return;busy(true);google.script.run.withSuccessHandler(()=>{busy(false);loadData();toast('Laporan dihapus.')}).withFailureHandler(e=>{busy(false);toast(e.message)}).hapusLaporan(id)}
function upload(id,period){showModal(`<h2>Upload ${esc(period)}</h2><div class="upload-box"><input id="fileInput" type="file"></div><div class="modal-actions"><button class="btn btn-light" onclick="manage('${id}')">Batal</button><button class="btn btn-primary" onclick="sendFile('${id}','${esc(period)}')">Upload</button></div>`)}
function sendFile(id,period){const input=document.getElementById('fileInput'),file=input.files[0];if(!file)return toast('Pilih file terlebih dahulu.');const reader=new FileReader();reader.onload=()=>{busy(true);google.script.run.withSuccessHandler(()=>{busy(false);loadData();manage(id);toast('File berhasil diunggah.')}).withFailureHandler(e=>{busy(false);toast(e.message)}).uploadFile({laporanId:id,periode:period,fileName:file.name,mimeType:file.type,base64:reader.result.split(',')[1]})};reader.readAsDataURL(file)}
function deleteFile(fid,rid){if(!confirm('Hapus file ini?'))return;busy(true);google.script.run.withSuccessHandler(()=>{busy(false);loadData();manage(rid);toast('File dihapus.')}).withFailureHandler(e=>{busy(false);toast(e.message)}).hapusFile(fid)}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalOverlay').classList.add('show')}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}
function active(i){document.querySelectorAll('.menu').forEach((e,n)=>e.classList.toggle('active',n===i))}
function title(a,b){document.getElementById('pageTitle').textContent=a;document.getElementById('pageSubtitle').textContent=b}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function icon(k){return {Bulanan:'📅',Triwulan:'📈',Semester:'📋',Tahunan:'🗂️',Lainnya:'📁'}[k]||'📄'}
function busy(v){document.getElementById('spinner').style.display=v?'flex':'none'}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script>
